services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: rootcause
      POSTGRES_DB: rootcause
    ports:
      - "5432:5432"
    volumes:
      - rootcause_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rootcause:rootcause@db:5432/rootcause
      JWT_SECRET: local-dev-secret-change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  rootcause_pg_data:
